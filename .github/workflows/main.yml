name: CI/CD Pipeline

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend (lint & tests)
    runs-on: ubuntu-22.04
    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/fullstack-app/backend #Python import resolution

    steps:
    #Loads your repository into the workflow runner.
    - uses: actions/checkout@v3 #It is a GitHub Action that downloads your repository’s code into the runner.
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        
    - name: Install backend dependencies
      run: |
        cd fullstack-app/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run backend tests
      run: |
        cd fullstack-app/backend
        pytest

  frontend-tests:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        
    - name: Install frontend dependencies
      run: |
        cd fullstack-app/frontend
        npm install
        
    - name: Run frontend tests
      run: |
        cd fullstack-app/frontend
        npm test

  # Builds your backend and frontend into Docker images
  # Pushes those images to Docker Hub
  # Allows your production server to pull and run them

  build-and-push-images:
    name: Build & Push Docker Images
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: |
        echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

    # Backend image
    - name: Build backend image
      run: |
        docker build \
          -t ${DOCKERHUB_USERNAME}/fullstack-backend:${IMAGE_TAG} \
          -t ${DOCKERHUB_USERNAME}/fullstack-backend:latest \
          fullstack-app/backend

    - name: Push backend image
      run: |
        docker push ${DOCKERHUB_USERNAME}/fullstack-backend:${IMAGE_TAG}
        docker push ${DOCKERHUB_USERNAME}/fullstack-backend:latest

    # Frontend image
    - name: Build frontend image
      run: |
        docker build \
          -t ${DOCKERHUB_USERNAME}/fullstack-frontend:${IMAGE_TAG} \
          -t ${DOCKERHUB_USERNAME}/fullstack-frontend:latest \
          fullstack-app/frontend

    - name: Push frontend image
      run: |
        docker push ${DOCKERHUB_USERNAME}/fullstack-frontend:${IMAGE_TAG}
        docker push ${DOCKERHUB_USERNAME}/fullstack-frontend:latest

        
  deploy:
    needs: [backend-tests, frontend-tests] #If either backend or frontend tests fail → the deployment will NOT run
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' #Only run the deploy job if the workflow is running on the main branch.
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production
      run: |
        echo "Add your deployment steps here"
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
